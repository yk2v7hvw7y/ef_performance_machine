<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>翼遥动漫社-表演大挑战</title>
<style>
  /* 整体页面样式：深色背景 + 金色主题 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #181a30;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 10px;
  }
  #stage { position: relative; }
  canvas {
    display: block;
    border-radius: 12px;
    /* 手机上自适应宽度，高度等比变化 */
    max-width: 100%;
    height: auto;
    touch-action: manipulation;
  }

  /* ---------- 中奖弹窗 ---------- */
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: none;                 /* 默认隐藏 */
    justify-content: center;
    align-items: center;
    border-radius: 12px;
    /* 让手机浏览器（尤其 iOS Safari）把遮罩识别为"可点击元素"，
       否则普通 div 上的 click 事件在部分手机上不触发 */
    cursor: pointer;
  }
  #overlay.show { display: flex; }
  #panel {
    width: 380px;
    max-width: 90%;
    background: #262a48;
    border: 2px solid #ffc83c;
    border-radius: 14px;
    padding: 16px;
    text-align: center;
    cursor: default;              /* 面板本身不可点，恢复普通鼠标样式 */
  }
  /* 图片/额外说明框 */
  #mediaBox {
    width: 100%;
    height: 200px;
    background: #373c5f;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    margin-bottom: 10px;
  }
  #mediaBox img { max-width: 100%; max-height: 100%; }
  #detailText {
    color: #f0f2ff;
    font-size: 17px;
    line-height: 1.5;
    padding: 10px;
  }
  #popNum {
    font-size: 38px;
    font-weight: bold;
    color: #ffc83c;
    margin: 6px 0;
  }
  #popText {
    color: #f0f2ff;
    font-size: 18px;
    line-height: 1.5;
    margin-bottom: 12px;
  }
  #popHint { color: #969cb4; font-size: 14px; }
</style>
</head>
<body>
<div id="stage">
  <!-- 游戏画面全部画在这张画布上 -->
  <canvas id="game" width="900" height="660"></canvas>

  <!-- 中奖弹窗（默认隐藏） -->
  <div id="overlay">
    <div id="panel">
      <div id="mediaBox">
        <img id="popImg" alt="" style="display:none">
        <div id="detailText"></div>
      </div>
      <div id="popNum"></div>
      <div id="popText"></div>
      <div id="popHint">点击弹窗外空白处关闭</div>
    </div>
  </div>
</div>

<script>
"use strict";

// ==================== 基本配置（与原 pygame 版一致） ====================
const SCREEN_W = 900, SCREEN_H = 660;
const REEL_W = 200, REEL_GAP = 30, ITEM_H = 72;
const REEL_TOP = 120;
const REEL_H = ITEM_H * 5;                    // 每个滚轮显示 5 格
const CENTER_Y = REEL_TOP + REEL_H / 2;

// 3 个滚轮的窗口矩形
const TOTAL_W = REEL_W * 3 + REEL_GAP * 2;
const REEL_X0 = (SCREEN_W - TOTAL_W) / 2;
const REEL_RECTS = [0, 1, 2].map(i => ({
  x: REEL_X0 + i * (REEL_W + REEL_GAP),
  y: REEL_TOP, w: REEL_W, h: REEL_H
}));

// ==================== 抽奖时间配置 ====================
const TOTAL_SPIN = 9.0;                       // 整轮总耗时（秒）
const STOP_INTERVAL = 0.8;                    // 相邻滚轮停止间隔
const STOP_TIMES = [
  TOTAL_SPIN - STOP_INTERVAL * 2,             // 7.4 秒
  TOTAL_SPIN - STOP_INTERVAL,                 // 8.2 秒
  TOTAL_SPIN                                  // 9.0 秒
];
const SPIN_TURNS = [6, 8, 10];                // 各滚轮滚动整圈数

// ==================== 滚轮数据（可扩展！） ====================
// 想增加数字：照着再加一个对象即可
// num：滚轮数字；text：弹窗正文；detail：框内额外说明（没有就填 null）
// image：图片路径（放在 slot_assets 文件夹；不需要填 null）
const ITEMS = [
  {num: 1, text: "对人群大声说出以上内容",
   detail: "关注塔菲喵~，关注塔菲谢谢喵~~~", image: null},
  {num: 2, text: "做出图示动作并大喊Ciallo",
   detail: null, image: "slot_assets/Ciallo.jpg"},
  {num: 3, text: "对人群做出以上动作",
   detail: "横屏高高举起你的手机，手机切换为白屏大声喊出：原神，启动！",
   image: null},
  {num: 4, text: "测试",
   detail: "测试",
   image: null},
  {num: 5, text: "测试",
   detail: "测试",
   image: null},
];
const ITEM_COUNT = ITEMS.length;
const CIRCUMFERENCE = ITEM_H * ITEM_COUNT;    // 转一圈的像素长度

// 数字带重复次数：当数字很少时（如只有3个），一圈(216px)短于滚轮窗口(360px)，
// 滚动时会出现大片空白。把同一组数字重复拼接，使整条带子足够长、始终填满窗口。
const STRIP_REPEAT = Math.ceil(
  (REEL_H + 2 * ITEM_H) / CIRCUMFERENCE);     // 需要覆盖窗口+上下各一格
const STRIP_H = CIRCUMFERENCE * STRIP_REPEAT; // 拼接后整条带子的长度

// 颜色
const COLOR_BG = "#181a30", COLOR_PANEL = "#262a48";
const COLOR_GOLD = "#ffc83c", COLOR_WHITE = "#f0f2ff";
const COLOR_GRAY = "#969cb4", COLOR_RED = "#e65a5a";

// ==================== 音效（Web Audio 现场合成，无需素材） ====================
let audioCtx = null;

function ensureAudio() {
  // 浏览器规定：必须在用户点击之后才能创建/启用声音
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
}

// 播放一个简单的合成音：frequencies 可以是随时间变化的频率
function playTone(freqStart, freqEnd, duration, volume) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const now = audioCtx.currentTime;
  osc.type = "sine";
  osc.frequency.setValueAtTime(freqStart, now);
  osc.frequency.linearRampToValueAtTime(freqEnd, now + duration);
  // 快速衰减包络，避免爆音
  gain.gain.setValueAtTime(volume, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + duration);
}

function sfxTick() { playTone(1300, 900, 0.05, 0.12); }
function sfxStop() { playTone(300, 120, 0.18, 0.25); }
function sfxWin() {
  // 中奖：C-E-G-C 上行琶音，依次播放
  const notes = [523.25, 659.25, 783.99, 1046.5];
  notes.forEach((f, i) =>
    setTimeout(() => playTone(f, f, 0.25, 0.2), i * 150));
}

// ==================== 缓动函数 ====================
// 开始快、结尾平滑减速到 0
function easeOutCubic(p) { return 1 - Math.pow(1 - p, 3); }

// ==================== 游戏状态 ====================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let state = "idle";                           // idle 等待 / spinning 抽奖中
let targets = [0, 0, 0];                      // 本轮结果下标
let distances = [0, 0, 0];                    // 本轮各滚轮总滚动距离
let startTime = 0;
let resultIndexes = [0, 0, 0];                // 静止时显示的下标
let lastTickOffset = [0, 0, 0];               // 上次滴答声时的位置
let stopSounded = [false, false, false];      // 停止声是否已响

// 开始按钮矩形
const btnRect = {x: SCREEN_W / 2 - 120, y: SCREEN_H - 100, w: 240, h: 60};

// ==================== 开始抽奖 ====================
// 随机抽出 3 个互不相同的下标（"洗牌发牌"思路：Fisher–Yates 洗牌算法）
// 像发扑克牌一样"不放回抽取"，保证 3 个滚轮停在不同数字上
function pickThreeDifferent() {
  // 准备一副"牌"：0, 1, 2, ..., ITEM_COUNT-1（每个数字的下标）
  const deck = ITEMS.map((_, i) => i);
  // 从后往前，每张牌和它前面（含自己）随机一张牌交换位置
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  // 取洗乱后的前 3 张；若数字不足 3 个则循环补齐（极端情况，正常有 5 个不会触发）
  const result = [];
  for (let k = 0; k < 3; k++) {
    result.push(deck[k % deck.length]);
  }
  return result;
}

function startSpin() {
  ensureAudio();                              // 点击手势中初始化声音
  targets = pickThreeDifferent();             // 3 个滚轮结果互不相同
  // 总距离 = 若干整条 + 落到目标格的对齐距离（保证停在正中间）
  distances = targets.map((t, i) =>
    SPIN_TURNS[i] * STRIP_H + t * ITEM_H);
  startTime = performance.now();
  lastTickOffset = [0, 0, 0];
  stopSounded = [false, false, false];
  state = "spinning";
  closePopup();
}

// ==================== 每帧更新（动画与音效触发） ====================
function update(now) {
  if (state !== "spinning") return;
  const elapsed = (now - startTime) / 1000;

  for (let i = 0; i < 3; i++) {
    const progress = Math.min(elapsed / STOP_TIMES[i], 1);
    const offset = distances[i] * easeOutCubic(progress);

    // 滴答声：每滚过一格（72px）响一次，节奏自动由密变疏
    while (offset - lastTickOffset[i] >= ITEM_H) {
      lastTickOffset[i] += ITEM_H;
      sfxTick();
    }
    // 该滚轮停止瞬间响一次咔哒声
    if (elapsed >= STOP_TIMES[i] && !stopSounded[i]) {
      stopSounded[i] = true;
      sfxStop();
      resultIndexes[i] = targets[i];
    }
  }

  // 全部停止：回到等待状态，播放中奖音
  if (elapsed >= TOTAL_SPIN) {
    resultIndexes = targets.slice();
    state = "idle";
    sfxWin();
  }
}

// ==================== 绘制 ====================
// 画一个滚轮；offset 为当前滚动偏移
function drawReel(i, offset) {
  const r = REEL_RECTS[i];

  // 滚轮背景
  ctx.fillStyle = COLOR_PANEL;
  roundRect(r.x, r.y, r.w, r.h, 12);
  ctx.fill();

  // 裁剪：数字只画在滚轮窗口内部
  ctx.save();
  ctx.beginPath();
  ctx.rect(r.x, r.y, r.w, r.h);
  ctx.clip();

  // 画重复拼接的数字带：每条带子包含 STRIP_REPEAT 组同样的数字
  for (let c = 0; c < STRIP_REPEAT; c++) {
    for (let j = 0; j < ITEM_COUNT; j++) {
      // 该数字在整条长带上的位置，对带长取模实现循环滚动
      // 注意：JS 里负数取模结果仍是负数（和 Python 不同），
      // 所以要先 +STRIP_H 再取一次模，保证结果落在 0~STRIP_H 之间，
      // 否则滚动偏移量变大后 rel 全为负，滚轮下半截会没有数字
      let rel = (j * ITEM_H + c * CIRCUMFERENCE - offset) % STRIP_H;
      rel = (rel + STRIP_H) % STRIP_H;
      // 换算成"相对中间格"的位置，让结果数字停在正中央
      if (rel > STRIP_H / 2) rel -= STRIP_H;
      const y = CENTER_Y + rel;
      if (y >= r.y - ITEM_H && y <= r.y + r.h) {
        ctx.fillStyle = COLOR_WHITE;
        ctx.font = "bold 34px 'Microsoft YaHei', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(ITEMS[j].num, r.x + r.w / 2, y);
      }
    }
  }
  ctx.restore();

  // 中间结果格的金色高亮边框
  ctx.strokeStyle = COLOR_GOLD;
  ctx.lineWidth = 3;
  roundRect(r.x, CENTER_Y - ITEM_H / 2, r.w, ITEM_H, 8);
  ctx.stroke();
}

// 圆角矩形路径辅助函数
function roundRect(x, y, w, h, radius) {
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.arcTo(x + w, y, x + w, y + h, radius);
  ctx.arcTo(x + w, y + h, x, y + h, radius);
  ctx.arcTo(x, y + h, x, y, radius);
  ctx.arcTo(x, y, x + w, y, radius);
  ctx.closePath();
}

function draw(now) {
  // 背景
  ctx.fillStyle = COLOR_BG;
  ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);

  // 标题
  ctx.fillStyle = COLOR_GOLD;
  ctx.font = "bold 40px 'Microsoft YaHei', sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("翼遥动漫社-表演大挑战", SCREEN_W / 2, 60);

  // 3 个滚轮
  for (let i = 0; i < 3; i++) {
    let offset;
    if (state === "spinning") {
      const elapsed = (now - startTime) / 1000;
      const progress = Math.min(elapsed / STOP_TIMES[i], 1);
      offset = distances[i] * easeOutCubic(progress);
    } else {
      offset = resultIndexes[i] * ITEM_H;
    }
    drawReel(i, offset);
  }

  // 开始按钮（抽奖中变灰）
  ctx.fillStyle = state === "spinning" ? "#5a5f78" : COLOR_RED;
  roundRect(btnRect.x, btnRect.y, btnRect.w, btnRect.h, 30);
  ctx.fill();
  ctx.fillStyle = COLOR_WHITE;
  ctx.font = "bold 26px 'Microsoft YaHei', sans-serif";
  ctx.fillText(state === "spinning" ? "抽奖中…" : "开始抽奖",
               SCREEN_W / 2, btnRect.y + btnRect.h / 2);

  // 操作提示
  if (state === "idle") {
    ctx.fillStyle = COLOR_GRAY;
    ctx.font = "18px 'Microsoft YaHei', sans-serif";
    ctx.fillText("抽奖结束后，点击滚轮中的数字查看挑战",
                 SCREEN_W / 2, REEL_TOP + REEL_H + 35);
  }

  // 版本标记（调试用）：看到右下角有 "v4" 才说明你打开的是修好的新文件
  ctx.fillStyle = "#555a78";
  ctx.font = "14px sans-serif";
  ctx.textAlign = "right";
  ctx.fillText("v4", SCREEN_W - 12, SCREEN_H - 12);
}

// ==================== 主循环 ====================
function frame(now) {
  update(now);
  draw(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ==================== 点击处理 ====================
canvas.addEventListener("mousedown", e => {
  handleClick(getCanvasPos(e));
});
// 手机触摸支持
canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  const t = e.touches[0];
  handleClick(getCanvasPos(t));
}, {passive: false});

// 把鼠标/触摸位置换算成画布内部坐标（兼容手机缩放显示）
function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (canvas.width / rect.width),
    y: (e.clientY - rect.top) * (canvas.height / rect.height)
  };
}

function inRect(pos, r) {
  return pos.x >= r.x && pos.x <= r.x + r.w &&
         pos.y >= r.y && pos.y <= r.y + r.h;
}

function handleClick(pos) {
  // 弹窗打开时点画布不响应（关闭弹窗由点遮罩处理）
  if (document.getElementById("overlay").classList.contains("show")) return;
  // 抽奖中不接受点击
  if (state === "spinning") return;

  // 点开始按钮
  if (inRect(pos, btnRect)) {
    startSpin();
    return;
  }

  // 点滚轮中间数字格 -> 弹窗
  for (let i = 0; i < 3; i++) {
    const centerBox = {
      x: REEL_RECTS[i].x, y: CENTER_Y - ITEM_H / 2,
      w: REEL_W, h: ITEM_H
    };
    if (inRect(pos, centerBox)) {
      openPopup(ITEMS[resultIndexes[i]]);
      return;
    }
  }
}

// ==================== 弹窗打开/关闭 ====================
const overlay = document.getElementById("overlay");
const popImg = document.getElementById("popImg");
const detailText = document.getElementById("detailText");

function openPopup(item) {
  // 数字与正文
  document.getElementById("popNum").textContent = item.num;
  document.getElementById("popText").textContent = item.text;

  // 媒体框：有图片显示图片；无图片显示额外说明（没有说明则提示）
  if (item.image) {
    popImg.src = item.image;
    popImg.style.display = "block";
    detailText.textContent = "";
  } else {
    popImg.style.display = "none";
    detailText.textContent = item.detail || "（无额外说明）";
  }
  overlay.classList.add("show");
}

function closePopup() {
  overlay.classList.remove("show");
}

// 点击弹窗外面的半透明空白处关闭；点面板本身不关闭
// 电脑鼠标：用 click
overlay.addEventListener("click", e => {
  if (e.target === overlay) closePopup();
});
// 手机触摸：直接监听 touchend（手指抬起）。
// 部分手机浏览器不会给普通 div 补 click 事件，这一条是手机端的保障
overlay.addEventListener("touchend", e => {
  if (e.target !== overlay) return;   // 点在面板上不关
  e.preventDefault();                 // 阻止浏览器再补一个 click，避免重复触发
  closePopup();
}, {passive: false});
</script>
</body>
</html>
